services:
  runner:
    build:
      context: .
    restart: unless-stopped
    environment:
      RUNNER_SCOPE_URL: ${RUNNER_SCOPE_URL}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: ${RUNNER_NAME:-usb-audio360-builder}
      RUNNER_LABELS: xbox360-xdk
    volumes:
      - runner-state:/actions-runner
      - xdk-cache:/var/cache/usb-audio360
      - type: bind
        source: ${XDK_INSTALLER_PATH}
        target: /opt/xbox360/XBOX360 SDK 21256.3.exe
        read_only: true
      - type: bind
        source: ${XEXTOOL_PATH}
        target: /opt/xbox360/xextool.exe
        read_only: true

volumes:
  runner-state:
  xdk-cache:
